name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        auditable: [true]
        exclude:
          # Laravel 13 exige PHP 8.3+ (não corre em 8.2)
          - laravel: '13.*'
            php: '8.2'
        include:
          # Também sem o pacote opcional gsebastiao/laravel-auditable,
          # como numa instalação mínima.
          - php: '8.2'
            laravel: '11.*'
            auditable: false
          - php: '8.4'
            laravel: '13.*'
            auditable: false

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}${{ !matrix.auditable && ' - sem auditoria' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, curl, sqlite3, pdo_sqlite, bcmath
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Remove the optional auditing package
        if: ${{ !matrix.auditable }}
        run: composer remove gsebastiao/laravel-auditable --dev --no-interaction --no-update

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest
